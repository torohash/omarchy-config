# Omarchy Tokyo Night — fcitx5 classicui theme
#
# Design follows sanweiya/fcitx5-mellow-themes (rounded rectangle, SVG 9-slice):
#   panel.svg     31x31 rounded rect (radius 9.5) -> panel background / menu
#   highlight.svg 31x31 rounded pill (radius 15.5) -> selected candidate
# Colours follow Omarchy's Tokyo Night palette (accent #7aa2f7).
#
# Mehods worth knowing:
#   - SVG backgrounds stay crisp at any DPI (PNG does not).
#   - "Margin" on Background/Highlight is the 9-slice border; it must be >= the
#     corner radius, otherwise the corners get stretched.
#   - Shadows/blur do not work on Wayland (KWin-only / not positioned by fcitx5),
#     so no ShadowMargin / EnableBlur here.

[Metadata]
Name=Omarchy Tokyo Night
Version=2
Author=local
Description=Tokyo Night theme for the fcitx5 candidate window
ScaleWithDPI=True

[InputPanel]
NormalColor=#a9b1d6
HighlightCandidateColor=#1a1b26
CandidateLabelColor=#565f89
HighlightCandidateLabelColor=#1a1b26
CandidateCommentColor=#565f89
HighlightColor=#c0caf5
HighlightBackgroundColor=#1a1b26
FullWidthHighlight=True
EnableBlur=False
PageButtonAlignment=Last Candidate

[InputPanel/Background]
Image=panel.svg

[InputPanel/Background/Margin]
Left=15
Right=15
Top=15
Bottom=15

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=15
Right=15
Top=10
Bottom=10

[InputPanel/ContentMargin]
Left=9
Right=9
Top=7
Bottom=6

[InputPanel/TextMargin]
Left=9
Right=9
Top=6
Bottom=7

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/ShadowMargin]
Left=0
Right=0
Top=0
Bottom=0

