# Omarchy Tokyo Night — fcitx5 classicui theme
# Matches ~/.local/state/omarchy/current/theme/colors.toml (Tokyo Night, accent #7aa2f7)
# User theme: lives under ~/.local/share/fcitx5/themes/ (no package install needed).

[Metadata]
Name=Omarchy Tokyo Night
Version=1
Author=local
Description=Tokyo Night theme for the fcitx5 candidate window
ScaleWithDPI=True

[InputPanel]
# Normal candidate text (foreground)
NormalColor=#a9b1d6
# Selected candidate text (sits on the accent highlight -> dark)
HighlightCandidateColor=#1a1b26
# Preedit (what you are typing)
HighlightColor=#c0caf5
HighlightBackgroundColor=#1a1b26
# Candidate number labels
CandidateLabelColor=#565f89
HighlightCandidateLabelColor=#1a1b26
# Comment (e.g. dictionary notes)
CandidateCommentColor=#565f89
Spacing=4
PageButtonAlignment=Last Candidate
FullWidthHighlight=True

[InputPanel/TextMargin]
Left=12
Right=12
Top=7
Bottom=7

[InputPanel/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

# Rounded, accent-bordered panel drawn from a 9-slice image.
[InputPanel/Background]
Image=background.png

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

# Selected candidate highlight (accent)
[InputPanel/Highlight]
Color=#7aa2f7

[InputPanel/Highlight/Margin]
Left=6
Right=6
Top=4
Bottom=4

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

# ---- Menus (right-click, settings) ----
[Menu]
NormalColor=#a9b1d6
HighlightCandidateColor=#1a1b26
Spacing=4

[Menu/Background]
Color=#1a1b26
BorderColor=#7aa2f7
BorderWidth=1

[Menu/Background/Margin]
Left=1
Right=1
Top=1
Bottom=1

[Menu/ContentMargin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/TextMargin]
Left=8
Right=8
Top=5
Bottom=5

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Color=#7aa2f7

[Menu/Highlight/Margin]
Left=6
Right=6
Top=4
Bottom=4

[Menu/Separator]
Color=#414868

# Let the Omarchy shell accent recolour these fields if UseAccentColor is on.
[AccentColorField]
0=Input Panel Border
1=Input Panel Highlight Candidate Background
2=Input Panel Highlight
3=Menu Border
4=Menu Separator
5=Menu Selected Item Background
