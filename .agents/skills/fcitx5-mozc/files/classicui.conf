# fcitx5 classicui (candidate window)
# User theme: ~/.local/share/fcitx5/themes/omarchy (rendered from Omarchy colors.toml by the theme-set hook)
Theme=omarchy
# Deterministic: don't let the XDG accent-color portal override the theme
UseAccentColor=False
PerScreenDPI=True
# Theme.conf has no Font key; font lives here.
Font=Noto Sans CJK JP 12
MenuFont=Noto Sans CJK JP 12
