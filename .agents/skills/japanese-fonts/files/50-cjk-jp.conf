<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- omarchy-config: japanese-fonts
     Prefer Japanese glyphs (Noto CJK JP) over the KR variants that an en_US locale falls back to.
     Latin fonts stay first so English text keeps the Omarchy defaults.
     system-ui: 65-nonlatin.conf names Noto Sans CJK KR in its chain, so GTK's Adwaita Sans
     (Chrome's tabs / address bar) drew kanji such as 社 with KR glyphs. Preferring JP here puts it ahead.
     monospace is not listed: `omarchy font set` owns it (in fonts.conf) and HackGen has Japanese glyphs. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
